<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AuditFlow v9.6.0</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <main class="popup-shell" aria-live="polite">
    <header class="popup-header">
      <div class="brand-row">
        <img src="./icons/icon-48.png" alt="" width="28" height="28">
        <div><strong>AuditFlow</strong><small id="subtitle">ASPICE 工作区</small></div>
      </div>
      <button class="language-button" id="languageButton" type="button" aria-label="切换语言" title="切换到英语">EN</button>
    </header>

    <section class="service-grid" aria-label="服务状态">
      <article class="service-card">
        <span id="aiStatusDot" class="status-dot checking"></span>
        <div><small id="aiLabel">AI 服务</small><strong id="aiStatus">检查中</strong></div>
      </article>
      <article class="service-card">
        <span id="helixStatusDot" class="status-dot checking"></span>
        <div><small id="helixLabel">Helix Bridge</small><strong id="helixStatus">检查中</strong></div>
      </article>
    </section>

    <section class="project-section" aria-labelledby="projectHeading">
      <div class="section-heading"><div><small id="projectEyebrow">工作区</small><h1 id="projectHeading">进行中的项目</h1></div><button class="text-button" id="refreshButton" type="button">刷新</button></div>
      <div id="projectList" class="project-list"></div>
    </section>

    <footer class="popup-footer">
      <button class="home-button" id="homeButton" type="button">进入首页</button>
      <button class="text-button" id="settingsButton" type="button">设置</button>
    </footer>
  </main>
  <script src="./popup.js"></script>
</body>
</html>
