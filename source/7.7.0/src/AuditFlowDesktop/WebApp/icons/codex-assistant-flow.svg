<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Codex Assessment Assistant</title>
  <desc id="desc">Blue data-flow paths with cyan and amber evidence nodes</desc>
