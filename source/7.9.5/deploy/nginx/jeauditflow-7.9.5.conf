# /etc/nginx/conf.d/jeauditflow-7.9.5.conf
# Replace auditflow.example.com and the certificate paths. The API listens only
# on 127.0.0.1:47983; nginx is the public entry point.

server {
    listen 80;
    server_name auditflow.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name auditflow.example.com;

    ssl_certificate     /etc/ssl/certs/auditflow.example.com.crt;
    ssl_certificate_key /etc/ssl/private/auditflow.example.com.key;

    client_max_body_size 64m;

    # Legacy desktop ops dashboard: its first registrant becomes ops admin.
    # The web workbench does not use these routes.
    location ~ ^/api/v1/(auth|admin)/ { return 404; }
    location = /ops.html { return 404; }

    location / {
        proxy_pass http://127.0.0.1:47983;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Must equal AUDITFLOW_TRUSTED_PROXY_SECRET when that is configured.
        # proxy_set_header X-AuditFlow-Proxy-Secret "<same secret>";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
